<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050a0d">
<title>E.V. // STATUS TRACKER</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --bg: #050a0d;
    --panel: #081418;
    --panel-2: #0b1a1f;
    --line: #143338;
    --line-bright: #1f4d52;
    --teal: #35e6c8;
    --teal-dim: #1c8577;
    --amber: #ff9a3d;
    --red: #ff5757;
    --text: #cdece6;
    --text-dim: #5f8a86;
    --glow: 0 0 12px rgba(53,230,200,0.35);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'JetBrains Mono', monospace;
    color: var(--text);
    min-height:100vh;
    padding: 18px;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 20% -10%, rgba(53,230,200,0.06), transparent 50%),
      radial-gradient(ellipse at 90% 110%, rgba(255,154,61,0.04), transparent 50%),
      var(--bg);
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px
    );
    pointer-events:none; z-index: 50;
  }
  .frame{ max-width: 1180px; margin: 0 auto; }

  /* Plain rectangles — no corner notch. */
  .header, .view-header, .ev-launch{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .header{
    display:flex; justify-content:space-between; align-items:center;
    border: 1px solid var(--line-bright);
    padding: 14px 20px; margin-bottom: 14px; position:relative;
    flex-wrap: wrap; gap: 10px;
  }
  .header .brand{ font-family:'Share Tech Mono', monospace; font-size: 20px; letter-spacing: 3px; color: var(--teal); text-shadow: var(--glow); }
  .header .brand span{ color: var(--text-dim); font-size:11px; letter-spacing:1.5px; display:block; margin-top:2px;}
  .header .brand span.named{ color: var(--amber); }
  .header .right{ display:flex; align-items:center; gap:14px; }
  .header .clock{ text-align:right; font-size:11px; color: var(--text-dim); letter-spacing:1px; }
  .header .clock b{ color: var(--teal); font-size:13px; }
  .gear{ cursor:pointer; color:var(--text-dim); font-size:18px; border:1px solid var(--line); padding:6px 10px; background:var(--panel-2); }
  .gear:hover{ color:var(--teal); border-color:var(--teal-dim); }
  .ring{ position:relative; width:56px; height:56px; }
  .ring svg{ transform: rotate(-90deg); }
  .ring-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--teal);}
  .grid{ display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media(max-width:900px){ .grid{ grid-template-columns: 1fr; } }
  .panel{ border: 1px solid var(--line); background: var(--panel); position: relative; padding: 14px 16px 16px; }
  .panel::before, .panel::after{ content:""; position:absolute; width:10px; height:10px; border: 1px solid var(--teal-dim); }
  .panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .panel-title{
    font-family:'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 3px; color: var(--amber);
    border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .panel-title .dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); box-shadow:0 0 6px var(--teal); animation: blink 2s infinite; flex:none; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }
  .task{ display:flex; align-items:flex-start; gap:10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .task:last-child{ border-bottom:none; }
  .task input[type=checkbox]{ appearance:none; width:15px; height:15px; margin-top:2px; border:1px solid var(--teal-dim); background:transparent; cursor:pointer; flex:none; position:relative; }
  .task input[type=checkbox]:checked{ background:var(--teal); box-shadow:var(--glow); }
  .task input[type=checkbox]:checked::after{ content:"\2713"; position:absolute; top:-3px; left:2px; font-size:11px; color:#04120f; font-weight:700; }
  .task.done label{ color: var(--text-dim); text-decoration: line-through; }
  .task label{ cursor:pointer; line-height:1.4; }
  .tag{ font-size:10px; color:var(--amber); border:1px solid var(--amber); padding:0 4px; letter-spacing:1px; white-space:nowrap; flex:none; }
  .task .tag{ margin-left:6px; }
  .del{ margin-left:auto; color:var(--text-dim); cursor:pointer; font-size:11px; flex:none; padding-left:8px; }
  .del:hover{ color:var(--red); }
  /* editable fields */
  .edit{ outline:none; border-bottom:1px dashed transparent; cursor:text; }
  .edit:hover{ border-bottom-color: var(--line-bright); }
  .edit:focus{ border-bottom-color: var(--teal); background: rgba(53,230,200,0.05); }
  .edit:empty::before{ content: attr(data-ph); color: var(--text-dim); opacity:.7; font-style:italic; }
  .mission-name{ font-family:'Share Tech Mono'; font-size:18px; color:var(--teal); text-shadow:var(--glow); margin-bottom:4px; }
  .mission-sub{ font-size:12px; color:var(--text-dim); margin-bottom:14px; letter-spacing:.5px;}
  .bar-row{ margin-bottom: 10px; }
  .bar-row .label-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:4px; letter-spacing:1px; gap:10px; }
  .bar-row .track-label{ color: var(--text); }
  .bar-track{ height:8px; background:var(--panel-2); border:1px solid var(--line); position:relative; overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--teal-dim), var(--teal)); box-shadow: var(--glow); transition: width .5s ease; }
  .next-up{ margin-top:16px; padding:10px 12px; border-left:2px solid var(--amber); background:rgba(255,154,61,0.06); font-size:12.5px; }
  .next-up b{ color:var(--amber); letter-spacing:1px; }
  .metric-label{ font-size:11px; color:var(--text-dim); letter-spacing:1px; }
  .metric-value{ font-family:'Share Tech Mono'; font-size:26px; color:var(--teal); text-shadow:var(--glow); margin:2px 0 14px; }
  .log-input-row{ display:flex; gap:8px; margin-bottom:12px; }
  .log-input-row input{ flex:1; background: var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'JetBrains Mono'; font-size:13px; padding:8px 10px; outline:none; }
  .log-input-row input:focus{ border-color: var(--teal-dim); box-shadow: 0 0 0 1px var(--teal-dim); }
  .log-input-row button, .btn{ background: var(--teal-dim); color:#04120f; border:none; font-family:'Share Tech Mono'; letter-spacing:1px; padding:8px 14px; cursor:pointer; font-size:12px; transition:.15s; }
  .log-input-row button:hover, .btn:hover{ background:var(--teal); box-shadow:var(--glow); }
  .btn:disabled{ background:var(--line); color:var(--text-dim); cursor:not-allowed; box-shadow:none; }
  .log-feed{ max-height: 190px; overflow-y:auto; font-size:12.5px; }
  .log-entry{ padding:6px 0; border-bottom: 1px dashed var(--line); display:flex; gap:8px;}
  .log-entry .ts{ color:var(--text-dim); font-size:10.5px; white-space:nowrap; margin-top:1px;}
  .empty-note{ color:var(--text-dim); font-size:12px; font-style:italic; line-height:1.6; }
  .add-row{ display:flex; gap:6px; margin-bottom:10px; }
  .add-row input, .add-row select{ background: var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'JetBrains Mono'; font-size:12px; padding:7px 9px; outline:none; min-width:0; }
  .add-row input.grow{ flex:1; }
  .add-row input.tagin{ width:74px; text-transform:uppercase; }
  .add-row input:focus, .add-row select:focus{ border-color: var(--teal-dim); }
  .add-row button{ background: var(--teal-dim); color:#04120f; border:none; font-family:'Share Tech Mono'; letter-spacing:1px; padding:7px 12px; cursor:pointer; font-size:11px; flex:none; }
  .add-row button:hover{ background:var(--teal); }

  /* ---------- METRIC MODULES ---------- */
  .page-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .page-card{ border:1px solid var(--line); background:var(--panel-2); padding:12px 14px 14px; position:relative; }
  .page-card:hover{ border-color: var(--teal-dim); }
  .page-card .pname{ font-family:'Share Tech Mono'; font-size:15px; color:var(--teal); letter-spacing:2px; margin-bottom:2px; word-break:break-word; }
  .page-card .pmeta{ font-size:10.5px; color:var(--text-dim); letter-spacing:1px; margin-bottom:12px; }
  .page-card .load-btn{ width:100%; background:transparent; border:1px solid var(--teal-dim); color:var(--teal);
    font-family:'Share Tech Mono'; letter-spacing:2px; font-size:11px; padding:8px; cursor:pointer; transition:.15s; }
  .page-card .load-btn:hover{ background:var(--teal-dim); color:#04120f; box-shadow:var(--glow); }
  .page-card .pdel{ position:absolute; top:8px; right:10px; color:var(--text-dim); cursor:pointer; font-size:11px; }
  .page-card .pdel:hover{ color:var(--red); }

  .view-header{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border:1px solid var(--line-bright);
    padding:14px 20px; margin-bottom:14px; position:relative; }
  .view-header .vtitle{ font-family:'Share Tech Mono'; font-size:19px; letter-spacing:3px; color:var(--teal); text-shadow:var(--glow); }
  .view-header .vsub{ font-size:10.5px; color:var(--text-dim); letter-spacing:2px; display:block; margin-top:2px; }
  .back-btn{ background:transparent; border:1px solid var(--line-bright); color:var(--text-dim);
    font-family:'Share Tech Mono'; letter-spacing:2px; font-size:11px; padding:8px 14px; cursor:pointer; }
  .back-btn:hover{ color:var(--teal); border-color:var(--teal-dim); }
  .export-btn{ color:var(--teal); border-color:var(--teal-dim); }
  .export-btn:hover{ background:var(--teal-dim); color:#04120f; box-shadow:var(--glow); }

  .metric-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:14px; }
  .metric-card{ border:1px solid var(--line); background:var(--panel-2); padding:12px 14px 14px; position:relative; }
  .metric-card::before{ content:""; position:absolute; top:-1px; left:-1px; width:9px; height:9px; border:1px solid var(--teal-dim); border-right:none; border-bottom:none; }
  .metric-card .mtitle{ font-size:11px; letter-spacing:2px; color:var(--amber); margin-bottom:2px; display:flex; justify-content:space-between; gap:8px; }
  .metric-card .mtitle .del{ margin-left:0; }
  .metric-card .mkind{ font-size:9.5px; color:var(--text-dim); letter-spacing:2px; margin-bottom:10px; }
  .chart-box{ height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .chart-box svg{ width:100%; height:100%; display:block; }
  .kpi-wrap{ text-align:left; width:100%; }
  .kpi-num{ font-family:'Share Tech Mono'; font-size:40px; line-height:1; color:var(--teal); text-shadow:var(--glow); }
  .kpi-num small{ font-size:15px; color:var(--text-dim); text-shadow:none; margin-left:4px; }
  .kpi-delta{ font-size:11px; letter-spacing:1px; margin-top:8px; color:var(--text-dim); }
  .kpi-delta.up{ color:var(--teal); } .kpi-delta.down{ color:var(--amber); }
  .metric-edit{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:10px; }
  .metric-edit input[type=number], .metric-edit input[type=text]{ width:72px; background:var(--bg); border:1px solid var(--line);
    color:var(--text); font-family:'JetBrains Mono'; font-size:11.5px; padding:5px 6px; outline:none; }
  .metric-edit input.series{ width:100%; }
  .metric-edit input:focus{ border-color:var(--teal-dim); }
  .metric-edit select{ background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
    font-family:'JetBrains Mono'; font-size:11px; padding:5px 4px; outline:none; }
  .metric-edit .lbl{ font-size:10px; color:var(--text-dim); letter-spacing:1px; }

  /* ---------- HUD DROPDOWN (replaces native select) ---------- */
  .hs{ position:relative; flex:none; }
  .hs.open{ z-index:81; }
  .hs-trigger{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg); border:1px solid var(--line); color:var(--teal);
    font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:2px;
    padding:6px 10px; cursor:pointer; min-width:136px; outline:none;
    -webkit-user-select:none; user-select:none; transition:.15s;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
  }
  .hs-trigger:hover, .hs.open .hs-trigger{ border-color:var(--teal-dim); background:var(--panel-2); }
  .hs-trigger:focus-visible{ border-color:var(--teal); box-shadow:0 0 0 1px var(--teal-dim); }
  .hs-caret{ color:var(--text-dim); font-size:8px; transition:transform .18s ease; }
  .hs.open .hs-caret{ transform:rotate(180deg); color:var(--teal); }
  .hs-panel{
    display:none; position:absolute; left:0; top:calc(100% + 5px); min-width:100%; z-index:82;
    background:var(--panel-2); border:1px solid var(--teal-dim); padding:3px;
    box-shadow: 0 10px 28px rgba(0,0,0,.7), 0 0 14px rgba(53,230,200,0.14);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }
  .hs.open .hs-panel{ display:block; }
  .hs.up .hs-panel{ top:auto; bottom:calc(100% + 5px);
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% 100%, 0 100%); }
  .hs-opt{
    display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px;
    font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:2px;
    color:var(--text-dim); cursor:pointer; white-space:nowrap; border-left:2px solid transparent;
  }
  .hs-opt::before{ content:"\25B8"; font-size:8px; opacity:0; }
  .hs-opt:hover, .hs-opt.active{ background:rgba(53,230,200,0.09); color:var(--text); border-left-color:var(--teal-dim); }
  .hs-opt.sel{ color:var(--teal); border-left-color:var(--teal); }
  .hs-opt.sel::before{ opacity:1; }

  /* ----------  CHANNEL ---------- */
  .ai-panel{ grid-column: 1 / -1; }
  .ev-launch{
    display:block; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--teal-dim); color:var(--teal);
    padding:16px 20px; margin-bottom:14px; transition:.18s; position:relative;
  }
  .ev-launch:hover{
    border-color:var(--teal);
    background: linear-gradient(180deg, #0d2229, var(--panel-2));
    box-shadow: 0 0 18px rgba(53,230,200,0.18);
  }
  .ev-launch-main{ display:block; font-family:'Share Tech Mono', monospace; font-size:17px; letter-spacing:4px;
    text-shadow: var(--glow); }
  .ev-launch-sub{ display:block; font-family:'Share Tech Mono', monospace; font-size:10px; letter-spacing:2px;
    color:var(--red); margin-top:5px; }
  .ev-launch-sub.on{ color:var(--text-dim); }
  .status-badge{ font-family:'Share Tech Mono'; font-size:10px; letter-spacing:2px; padding:2px 8px; border:1px solid; white-space:nowrap; }
  .status-badge.off{ color:var(--red); border-color:var(--red); background:rgba(255,87,87,0.08); }
  .status-badge.on{ color:var(--teal); border-color:var(--teal-dim); background:rgba(53,230,200,0.08); }
  .chat-window{ min-height: 300px; max-height: calc(100vh - 300px); overflow-y:auto;
    padding: 4px 4px 10px; margin-bottom:12px; display:flex; flex-direction:column; gap:10px; }
  .msg{ font-size:13px; line-height:1.5; max-width:80%; padding:9px 12px; white-space:pre-wrap; }
  .msg.user{ align-self:flex-end; background: var(--panel-2); border:1px solid var(--line); color:var(--text); }
  .msg.ev{ align-self:flex-start; background: rgba(53,230,200,0.06); border:1px solid var(--line-bright); color:var(--text); }
  .msg.ev.offline{ background: rgba(255,87,87,0.05); border-color: rgba(255,87,87,0.4); }
  .msg.ev .who{ color:var(--teal); font-family:'Share Tech Mono'; font-size:10px; letter-spacing:2px; display:block; margin-bottom:4px; }
  .msg.ev.offline .who{ color:var(--red); }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'JetBrains Mono'; padding:10px 12px; outline:none; font-size:13px;}
  .chat-input-row input:focus{ border-color:var(--teal-dim); }
  .chat-input-row input:disabled{ color:var(--text-dim); cursor:not-allowed; }
  .typing{ color:var(--text-dim); font-size:12px; font-style:italic; }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line-bright); }
  ::-webkit-scrollbar-track{ background: transparent; }
  .footer-note{ text-align:center; font-size:10.5px; color:var(--text-dim); letter-spacing:1px; margin-top:6px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.78); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; overflow-y:auto; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background: var(--panel); border:1px solid var(--line-bright); max-width: 480px; width:100%; padding:20px; margin:auto; }
  .modal h3{ font-family:'Share Tech Mono'; color:var(--teal); letter-spacing:2px; font-size:14px; margin:0 0 4px; }
  .modal p{ font-size:12px; color:var(--text-dim); margin:0 0 14px; line-height:1.5; }
  .modal label{ font-size:11px; color:var(--text-dim); letter-spacing:1px; display:block; margin:12px 0 4px; }
  .modal input{ width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'JetBrains Mono'; padding:8px 10px; outline:none; font-size:12px; }
  .modal input:focus{ border-color:var(--teal-dim); }
  .modal .sect{ border-top:1px solid var(--line); margin-top:18px; padding-top:6px; }
  .modal .sect-title{ font-family:'Share Tech Mono'; font-size:11px; letter-spacing:2px; color:var(--amber); margin-top:10px; }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; justify-content:flex-end; flex-wrap:wrap; }
  .modal-actions button{ font-family:'Share Tech Mono'; font-size:11px; letter-spacing:1px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); }
  .modal-actions button.primary{ background:var(--teal-dim); color:#04120f; border-color:var(--teal-dim); }
  .modal-actions button.danger{ color:var(--red); border-color:var(--red); margin-right:auto; }
  .sync-status{ font-size:10.5px; color:var(--text-dim); margin-top:8px; line-height:1.5; }
  .sync-status.ok{ color: var(--teal); }
  .sync-status.err{ color: var(--red); }
  .diag-btn{ margin-top:12px; width:100%; background:transparent; border:1px solid var(--line-bright); color:var(--text-dim);
    font-family:'Share Tech Mono', monospace; letter-spacing:2px; font-size:11px; padding:8px; cursor:pointer; }
  .diag-btn:hover{ color:var(--teal); border-color:var(--teal-dim); }
  .diag-out{ display:none; margin-top:10px; border:1px solid var(--line); background:var(--bg); padding:10px 12px;
    font-size:11px; line-height:1.6; max-height:210px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  .diag-out.show{ display:block; }
  .diag-out b{ font-family:'Share Tech Mono', monospace; letter-spacing:1px; }
  .diag-out .ok{ color:var(--teal); }
  .diag-out .bad{ color:var(--red); }
  .diag-out .warn{ color:var(--amber); }
  .diag-out .dim{ color:var(--text-dim); }
  .tabbar{ display:flex; gap:0; border-bottom:1px solid var(--line); margin:14px 0 4px; }
  .tabbar .tab{ flex:1; background:transparent; border:none; border-bottom:2px solid transparent;
    color:var(--text-dim); font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:2px;
    padding:9px 4px; cursor:pointer; transition:.15s; }
  .tabbar .tab:hover{ color:var(--text); }
  .tabbar .tab.active{ color:var(--teal); border-bottom-color:var(--teal); text-shadow:var(--glow); }
  .tabpane{ display:none; }
  .tabpane.show{ display:block; }
  .btn-row{ display:flex; gap:8px; margin-top:12px; }
  .btn-row .diag-btn{ margin-top:0; }
  .hint-box{ border-left:2px solid var(--line-bright); background:rgba(53,230,200,0.04);
    padding:8px 10px; font-size:11px; line-height:1.55; color:var(--text-dim); margin:10px 0 4px; }
  .hint-box b.ok{ color:var(--teal); }
  .hint-box b.warn{ color:var(--amber); }
  .key-row{ display:flex; gap:6px; }
  .key-row input{ flex:1; }
  .key-eye{ flex:none; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    padding:0 14px; cursor:pointer; font-family:'Share Tech Mono', monospace; font-size:10.5px; letter-spacing:2px; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  
// ============================================================
//  E.V. STATUS TRACKER v3.0
//  Generic build — nothing is hardcoded to any person or school.
//  v3 adds: editable track labels, API online/offline state,
//           user-named metric pages with six chart types,
//           and identity personalization.
// ============================================================

// ---------- CONFIG ----------
const CFG_KEY   = 'ev-tracker-config';
const STATE_KEY = 'ev-tracker-state-local';
let cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
let supabaseClient = null;

function apiOnline(){ return !!(cfg.geminiKey && cfg.geminiKey.trim()); }

// ---------- ACCOUNT / DATA KEY ----------
// Signed in, the row key IS the Supabase user id, so an RLS policy of
//   sync_code = auth.uid()::text
// lets the database enforce that you only ever read or write your own row.
// Signed out, it falls back to the old shared sync code (guessable — see the note in SYNC).
let authUser = null;
function syncKey(){ return authUser ? authUser.id : ((cfg.syncCode || '').trim()); }

function updateSyncBadge(){
  const el = document.getElementById('syncState');
  if(authUser)                          el.textContent = 'ACCOUNT';
  else if(supabaseClient && syncKey())  el.textContent = 'CLOUD';
  else if(supabaseClient)               el.textContent = 'NO KEY';
  else                                  el.textContent = 'LOCAL';
}

function renderAuthState(){
  const box  = document.getElementById('authState');
  const form = document.getElementById('authForm');
  const out  = document.getElementById('signOutBtn');
  const note = document.getElementById('syncModeNote');
  if(authUser){
    box.innerHTML = 'Signed in as <b class="ok">' + esc(authUser.email || authUser.id) + '</b><br>Your data is keyed to this account on every device.';
    form.style.display = 'none';
    out.style.display  = '';
    note.innerHTML = 'Signed in — data is keyed to your account id. The sync code below is <b>ignored</b>.';
  } else {
    box.innerHTML = supabaseClient
      ? 'Not signed in. Data uses the sync code under the SYNC tab.'
      : 'Not signed in. Connect Supabase under the <b class="warn">SYNC</b> tab first — accounts run on it.';
    form.style.display = supabaseClient ? '' : 'none';
    out.style.display  = 'none';
    const urlNote = document.getElementById('authUrlNote');
    if(supabaseClient){
      urlNote.style.display = '';
      urlNote.innerHTML = 'Supabase must be told where this app lives, or confirmation links 404. Set <b class="ok">Site URL</b> to<br><b class="ok">' +
        esc(location.origin + location.pathname) + '</b><br>under Authentication → URL Configuration.';
    } else {
      urlNote.style.display = 'none';
    }
    note.innerHTML = 'Signed out — anyone who knows or guesses this code can read and overwrite your data. Sign in on the IDENTITY tab for real per-account isolation.';
  }
  updateSyncBadge();
}

async function pullCloud(){
  const k = syncKey();
  if(!supabaseClient || !k) return;
  const { data, error } = await supabaseClient.from('ev_tracker').select('*').eq('sync_code', k).maybeSingle();
  if(error) throw error;
  if(data && data.state){
    state = migrate(data.state);
    persistLocal();
  } else {
    await supabaseClient.from('ev_tracker').insert({ sync_code: k, state });
  }
  applyIdentity(); render();
}

async function doAuth(mode){
  const msg = document.getElementById('authMsg');
  const set = (t, cls) => { msg.textContent = t; msg.className = 'sync-status' + (cls ? ' ' + cls : ''); };
  if(!supabaseClient){ set('Connect Supabase under the SYNC tab first, then SAVE.', 'err'); return; }
  const email = document.getElementById('cfgAuthEmail').value.trim();
  const pass  = document.getElementById('cfgAuthPass').value;
  if(!email || !pass){ set('Email and password are both required.', 'err'); return; }
  if(pass.length < 6){ set('Password must be at least 6 characters.', 'err'); return; }
  set('Working...');
  try{
    // Without emailRedirectTo the confirmation link goes to Supabase's default
    // Site URL (http://localhost:3000), which is dead on a hosted page.
    const redirectTo = location.origin + location.pathname;
    const { data, error } = mode === 'up'
      ? await supabaseClient.auth.signUp({ email, password: pass, options: { emailRedirectTo: redirectTo } })
      : await supabaseClient.auth.signInWithPassword({ email, password: pass });
    if(error){ set(error.message, 'err'); return; }
    if(mode === 'up' && !data.session){
      set('Account created — confirmation email sent. If that link lands on "site can\'t be reached", set Site URL to ' +
          redirectTo + ' under Authentication → URL Configuration in Supabase, or switch off "Confirm email" under Authentication → Providers → Email.', 'ok');
      return;
    }
    authUser = data.user;
    document.getElementById('cfgAuthPass').value = '';
    set('Signed in as ' + authUser.email + '. Pulling your data...', 'ok');
    await pullCloud();
    set('Signed in as ' + authUser.email + '.', 'ok');
    renderAuthState();
  }catch(e){ set(e.message || 'Sign-in failed.', 'err'); }
}

async function doSignOut(){
  const msg = document.getElementById('authMsg');
  try{ if(supabaseClient) await supabaseClient.auth.signOut(); }catch(e){}
  authUser = null;
  msg.textContent = 'Signed out. Local data on this device is untouched.';
  msg.className = 'sync-status';
  renderAuthState();
}

async function initAuth(){
  if(!supabaseClient){ renderAuthState(); return; }
  try{
    const { data } = await supabaseClient.auth.getSession();
    authUser = (data && data.session) ? data.session.user : null;
    if(authUser) await pullCloud();
  }catch(e){ console.warn('session restore failed', e); }
  renderAuthState();
}

function genSyncCode(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return [...a].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);
}

function initSupabase(){
  if(cfg.supaUrl && cfg.supaKey && window.supabase){
    try{
      supabaseClient = window.supabase.createClient(cfg.supaUrl, cfg.supaKey);
    }catch(e){
      supabaseClient = null;
    }
  } else {
    supabaseClient = null;
  }
  updateSyncBadge();
}

function openSettings(){
  document.getElementById('cfgUserName').value  = (state.user && state.user.name) || '';
  document.getElementById('cfgSyncCode').value  = cfg.syncCode  || '';
  document.getElementById('cfgSupaUrl').value   = cfg.supaUrl   || '';
  document.getElementById('cfgSupaKey').value   = cfg.supaKey   || '';
  document.getElementById('cfgGeminiKey').value = cfg.geminiKey || '';
  const s = document.getElementById('syncStatusMsg');
  s.textContent = ''; s.className = 'sync-status';
  const d = document.getElementById('diagOut');
  d.innerHTML = ''; d.className = 'diag-out';
  document.getElementById('cfgGeminiKey').type = 'password';
  document.getElementById('keyEyeBtn').textContent = 'SHOW';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'sync-status';
  renderModelSelect();
  renderAuthState();
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }

async function saveSettings(){
  const prevOnline = apiOnline();
  const newName = document.getElementById('cfgUserName').value.trim();
  const nameChanged = newName && newName !== (state.user.name || '');
  state.user.name = newName;

  cfg.syncCode  = document.getElementById('cfgSyncCode').value.trim();
  cfg.supaUrl   = document.getElementById('cfgSupaUrl').value.trim();
  cfg.supaKey   = document.getElementById('cfgSupaKey').value.trim();
  cfg.geminiKey = document.getElementById('cfgGeminiKey').value.trim();
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

  initSupabase();
  applyIdentity();
  applyApiState();

  const statusEl = document.getElementById('syncStatusMsg');
  const hello = state.user.name ? 'Hello, ' + state.user.name + '. ' : '';
  const k = syncKey();

  await initAuth();

  if(supabaseClient && k){
    statusEl.textContent = 'Connecting...';
    statusEl.className = 'sync-status';
    try{
      const { data, error } = await supabaseClient
        .from('ev_tracker').select('*').eq('sync_code', k).maybeSingle();
      if(error){
        statusEl.textContent = 'Sync error: ' + error.message;
        statusEl.className = 'sync-status err';
        return;
      }
      if(data && data.state){
        const incoming = migrate(data.state);
        // local identity wins if the user just typed one
        if(newName) incoming.user.name = newName;
        state = incoming;
      } else {
        await supabaseClient.from('ev_tracker').insert({ sync_code: k, state });
      }
      statusEl.textContent = hello + (authUser ? 'Synced to your account.' : 'Connected.');
      statusEl.className = 'sync-status ok';
      persistLocal();
      applyIdentity();
      render();
    }catch(e){
      statusEl.textContent = 'Connection failed: ' + e.message;
      statusEl.className = 'sync-status err';
      return;
    }
  } else {
    save();
    statusEl.textContent = hello + (supabaseClient ? 'Saved. Sign in or set a sync code to enable cross-device sync.' : 'Saved locally.');
    statusEl.className = 'sync-status ok';
  }
  updateSyncBadge();

  // announce an API state change in the channel
  if(apiOnline() && !prevOnline){
    pushMsg('ev', 'API ONLINE — CONNECTION ESTABLISHED. ' + (state.user.name ? 'Hello, ' + state.user.name + '. ' : '') + "What's the status?");
  } else if(!apiOnline() && prevOnline){
    pushMsg('ev', 'API OFFLINE — AWAITING CONNECTION.', true);
  } else if(nameChanged && apiOnline()){
    pushMsg('ev', 'Hello, ' + state.user.name + '. HUD relabeled.');
  }

  setTimeout(closeSettings, 900);
}

function resetTracker(){
  state = structuredClone(defaultState);
  chatHistory = [];
  currentPageId = null;
  save();
  applyIdentity();
  render();
  document.getElementById('chatWindow').innerHTML = '';
  greet();
  closeSettings();
}

// ---------- STATE ----------
// Ships empty on purpose: whoever opens this gets a blank tracker of their own.
const defaultState = {
  user:    { name: '' },
  mission: { name: '', sub: '', next: '' },
  trackLabels: {},                 // { TAG: "Friendly display name" } — display only, tags stay canonical
  profile: { metricLabel: '', metricValue: '', lines: [] },
  metricPages: [],                 // [{ id, name, metrics:[{id,label,type,value,target,unit,series}] }]
  tasks: [],
  logs: []
};

function migrate(raw){
  const s = structuredClone(defaultState);
  if(!raw || typeof raw !== 'object') return s;
  s.user        = Object.assign(s.user, raw.user || {});
  s.mission     = Object.assign(s.mission, raw.mission || {});
  s.trackLabels = (raw.trackLabels && typeof raw.trackLabels === 'object') ? raw.trackLabels : {};
  s.profile     = Object.assign(s.profile, raw.profile || {});
  s.profile.lines = Array.isArray(s.profile.lines) ? s.profile.lines : [];
  s.tasks = Array.isArray(raw.tasks) ? raw.tasks : [];
  s.logs  = Array.isArray(raw.logs)  ? raw.logs  : [];
  s.metricPages = Array.isArray(raw.metricPages) ? raw.metricPages.map(p=>({
    id: p.id || uid('pg'),
    name: String(p.name || 'UNTITLED'),
    metrics: Array.isArray(p.metrics) ? p.metrics.map(normalizeMetric) : []
  })) : [];
  return s;
}

function normalizeMetric(m){
  const types = ['kpi','bar','bullet','gauge','thermo','line'];
  return {
    id: m.id || uid('m'),
    label: String(m.label || 'METRIC'),
    type: types.includes(m.type) ? m.type : 'kpi',
    value: num(m.value, 0),
    target: num(m.target, 100),
    unit: String(m.unit || ''),
    series: Array.isArray(m.series) ? m.series.map(v=>num(v,0)) : []
  };
}

function num(v, d){ const n = parseFloat(v); return isFinite(n) ? n : d; }

let state = migrate(JSON.parse(localStorage.getItem(STATE_KEY) || 'null'));
let currentPageId = null;

function esc(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }

// Progress is derived from whatever tags the user's own objectives carry.
// The DISPLAY NAME of each track is overridable via state.trackLabels — the tag itself never changes.
function computeProgress(){
  const map = new Map();
  state.tasks.forEach(t=>{
    const tag = (t.tag || 'GENERAL').toUpperCase();
    if(!map.has(tag)) map.set(tag, { done:0, total:0 });
    const e = map.get(tag);
    e.total++; if(t.done) e.done++;
  });
  const tracks = [...map.entries()].map(([tag,v])=>({
    tag,
    label: state.trackLabels[tag] || tag,
    done:v.done, total:v.total,
    pct: Math.round((v.done/v.total)*100)
  })).sort((a,b)=> b.total - a.total || a.tag.localeCompare(b.tag));
  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.done).length;
  return { tracks, done, total, overall: total ? Math.round((done/total)*100) : 0 };
}

// ---------- IDENTITY ----------
function applyIdentity(){
  const sub = document.getElementById('brandSub');
  const nm = (state.user && state.user.name || '').trim();
  if(nm){
    sub.textContent = nm.toUpperCase() + "'S HUD";
    sub.classList.add('named');
  } else {
    sub.textContent = 'USER H.U.D.';
    sub.classList.remove('named');
  }
}

// ---------- API STATE ----------
function applyApiState(){
  const badge  = document.getElementById('apiBadge');
  const input  = document.getElementById('chatInput');
  const btn    = document.getElementById('chatSendBtn');
  const launch = document.getElementById('evLaunchStatus');
  const online = apiOnline();
  const label  = online ? 'API ONLINE — CONNECTION ESTABLISHED' : 'API OFFLINE — AWAITING CONNECTION';
  badge.textContent = label;
  badge.className = 'status-badge ' + (online ? 'on' : 'off');
  // the launcher carries the same status, so it reads at a glance from the HUD
  launch.textContent = label;
  launch.className = 'ev-launch-sub' + (online ? ' on' : '');
  input.disabled = !online; btn.disabled = !online;
  input.placeholder = online ? 'Ask E.V. anything...' : 'Channel offline.';
}

// ============================================================
//  CHART RENDERERS — hand-rolled SVG, no libraries, offline-safe
// ============================================================
const C_TEAL='#35e6c8', C_DIM='#1c8577', C_AMBER='#ff9a3d', C_LINE='#143338', C_TXT='#5f8a86';

function pctOf(m){
  if(!m.target) return 0;
  return clamp01(m.value / m.target);
}
function fmt(n){
  if(!isFinite(n)) return '0';
  return (Math.round(n*100)/100).toLocaleString();
}

function chartKPI(m){
  const p = Math.round(pctOf(m)*100);
  const diff = m.value - m.target;
  const cls = diff >= 0 ? 'up' : 'down';
  const arrow = diff >= 0 ? '▲' : '▼';
  return '<div class="kpi-wrap">' +
    '<div class="kpi-num">' + esc(fmt(m.value)) + (m.unit ? '<small>' + esc(m.unit) + '</small>' : '') + '</div>' +
    '<div class="kpi-delta ' + cls + '">' + arrow + ' ' + esc(fmt(Math.abs(diff))) + ' vs target ' + esc(fmt(m.target)) + ' &middot; ' + p + '%</div>' +
    '</div>';
}

function chartBar(m){
  const p = Math.round(pctOf(m)*100);
  return '<div style="width:100%">' +
    '<div class="label-row" style="display:flex;justify-content:space-between;font-size:11px;color:' + C_TXT + ';margin-bottom:6px;letter-spacing:1px;">' +
      '<span>' + esc(fmt(m.value)) + ' ' + esc(m.unit) + '</span><span>' + p + '% of ' + esc(fmt(m.target)) + '</span></div>' +
    '<div class="bar-track" style="height:14px;"><div class="bar-fill" style="width:' + p + '%"></div></div>' +
    '</div>';
}

function chartBullet(m){
  const W=300, H=54, x0=6, w=W-12;
  const max = Math.max(m.target, m.value) * 1.15 || 1;
  const barW = (clamp01(m.value/max)) * w;
  const tx = x0 + clamp01(m.target/max) * w;
  const b1 = w*0.55, b2 = w*0.80;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<rect x="' + x0 + '" y="12" width="' + b1 + '" height="22" fill="#0e2429"/>' +
    '<rect x="' + (x0+b1) + '" y="12" width="' + (b2-b1) + '" height="22" fill="#122e34"/>' +
    '<rect x="' + (x0+b2) + '" y="12" width="' + (w-b2) + '" height="22" fill="#16383f"/>' +
    '<rect x="' + x0 + '" y="18" width="' + barW + '" height="10" fill="' + C_TEAL + '" style="filter:drop-shadow(0 0 4px ' + C_TEAL + ')"/>' +
    '<line x1="' + tx + '" y1="8" x2="' + tx + '" y2="38" stroke="' + C_AMBER + '" stroke-width="3"/>' +
    '<text x="' + x0 + '" y="50" fill="' + C_TXT + '" font-size="10" font-family="JetBrains Mono, monospace">' + esc(fmt(m.value)) + ' ' + esc(m.unit) + '</text>' +
    '<text x="' + (W-6) + '" y="50" fill="' + C_AMBER + '" font-size="10" text-anchor="end" font-family="JetBrains Mono, monospace">TARGET ' + esc(fmt(m.target)) + '</text>' +
    '</svg>';
}

function gaugePt(cx, cy, r, t){
  const ang = Math.PI * (1 - clamp01(t));
  return [cx + r*Math.cos(ang), cy - r*Math.sin(ang)];
}
function chartGauge(m){
  const W=230, H=152, cx=115, cy=104, r=88;
  const t = pctOf(m);
  const [sx,sy] = gaugePt(cx,cy,r,0);
  const [ex,ey] = gaugePt(cx,cy,r,1);
  const arc = 'M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' A ' + r + ' ' + r + ' 0 0 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1);
  const len = Math.PI * r;
  const [nx,ny] = gaugePt(cx,cy,r-26,t);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<path d="' + arc + '" stroke="' + C_LINE + '" stroke-width="15" fill="none" stroke-linecap="butt"/>' +
    '<path d="' + arc + '" stroke="' + C_TEAL + '" stroke-width="15" fill="none" stroke-linecap="butt" ' +
      'stroke-dasharray="' + len.toFixed(1) + '" stroke-dashoffset="' + (len - len*t).toFixed(1) + '" ' +
      'style="filter:drop-shadow(0 0 5px ' + C_TEAL + '); transition:stroke-dashoffset .5s ease"/>' +
    '<line x1="' + cx + '" y1="' + cy + '" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="' + C_AMBER + '" stroke-width="3"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + C_AMBER + '"/>' +
    '<text x="16" y="' + (cy+15) + '" fill="' + C_TXT + '" font-size="10" font-family="JetBrains Mono, monospace">0</text>' +
    '<text x="' + (W-16) + '" y="' + (cy+15) + '" fill="' + C_TXT + '" font-size="10" text-anchor="end" font-family="JetBrains Mono, monospace">' + esc(fmt(m.target)) + '</text>' +
    '<text x="' + cx + '" y="' + (cy+32) + '" fill="' + C_TEAL + '" font-size="27" text-anchor="middle" font-family="Share Tech Mono, monospace">' + Math.round(t*100) + '%</text>' +
    '<text x="' + cx + '" y="' + (cy+46) + '" fill="' + C_TXT + '" font-size="9.5" text-anchor="middle" font-family="JetBrains Mono, monospace">' + esc(fmt(m.value)) + ' / ' + esc(fmt(m.target)) + (m.unit ? ' ' + esc(m.unit) : '') + '</text>' +
    '</svg>';
}

function chartThermo(m){
  const W=300, H=132, tx=22, top=10, tubeH=76, tubeW=20, bulbR=16, bulbY=top+tubeH+10;
  const t = pctOf(m);
  const fillH = tubeH * t;
  const sx = tx + tubeW + 6, lx = tx + tubeW + 16;   // tick + label x
  const rx = 128;                                     // readout column x
  const tick = (y) => '<line x1="' + sx + '" y1="' + y + '" x2="' + (sx+7) + '" y2="' + y + '" stroke="' + C_TXT + '"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<rect x="' + tx + '" y="' + top + '" width="' + tubeW + '" height="' + tubeH + '" rx="' + (tubeW/2) + '" fill="#0e2429" stroke="' + C_LINE + '"/>' +
    '<rect x="' + (tx+3) + '" y="' + (top + tubeH - fillH).toFixed(1) + '" width="' + (tubeW-6) + '" height="' + fillH.toFixed(1) + '" rx="' + ((tubeW-6)/2) + '" fill="' + C_TEAL + '" style="filter:drop-shadow(0 0 5px ' + C_TEAL + '); transition:all .5s ease"/>' +
    '<circle cx="' + (tx+tubeW/2) + '" cy="' + bulbY + '" r="' + bulbR + '" fill="' + C_TEAL + '" style="filter:drop-shadow(0 0 6px ' + C_TEAL + ')"/>' +
    tick(top+1) + tick(top+tubeH/2) + tick(top+tubeH) +
    '<text x="' + lx + '" y="' + (top+5) + '" fill="' + C_AMBER + '" font-size="10" font-family="JetBrains Mono, monospace">' + esc(fmt(m.target)) + '</text>' +
    '<text x="' + lx + '" y="' + (top+tubeH/2+4) + '" fill="' + C_TXT + '" font-size="10" font-family="JetBrains Mono, monospace">' + esc(fmt(m.target/2)) + '</text>' +
    '<text x="' + lx + '" y="' + (top+tubeH+4) + '" fill="' + C_TXT + '" font-size="10" font-family="JetBrains Mono, monospace">0</text>' +
    '<text x="' + (tx+tubeW/2) + '" y="' + (bulbY+5) + '" fill="#04120f" font-size="11" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, monospace">' + Math.round(t*100) + '</text>' +
    '<text x="' + rx + '" y="' + (top+42) + '" fill="' + C_TEAL + '" font-size="34" font-family="Share Tech Mono, monospace" style="filter:drop-shadow(0 0 5px rgba(53,230,200,.5))">' + esc(fmt(m.value)) + '</text>' +
    '<text x="' + rx + '" y="' + (top+62) + '" fill="' + C_TXT + '" font-size="10.5" font-family="JetBrains Mono, monospace">' + esc(m.unit ? m.unit.toUpperCase() + ' · ' : '') + 'TARGET ' + esc(fmt(m.target)) + '</text>' +
    '<text x="' + rx + '" y="' + (top+80) + '" fill="' + C_AMBER + '" font-size="11" font-family="JetBrains Mono, monospace">' + Math.round(t*100) + '% OF GOAL</text>' +
    '</svg>';
}

function chartLine(m){
  const pts = (m.series && m.series.length) ? m.series : [m.value];
  const W=300, H=110, pad=8, bottom=H-22, topY=10;
  if(pts.length < 2){
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
      '<text x="' + (W/2) + '" y="' + (H/2) + '" fill="' + C_TXT + '" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Add 2+ values below to plot a line</text>' +
      '</svg>';
  }
  // scale to the data (plus the target line), not to zero — otherwise real trends flatten out
  const tgt = isFinite(m.target) ? m.target : null;
  let hi = Math.max(...pts, tgt === null ? -Infinity : tgt);
  let lo = Math.min(...pts, tgt === null ?  Infinity : tgt);
  let span = hi - lo;
  if(span === 0){ hi += 1; lo -= 1; span = 2; }
  const padSpan = span * 0.12;
  hi += padSpan; lo -= padSpan; span = hi - lo;
  const stepX = (W - pad*2) / (pts.length - 1);
  const xy = pts.map((v,i)=>[ pad + i*stepX, bottom - ((v - lo)/span) * (bottom - topY) ]);
  const line = xy.map(p=>p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = 'M ' + pad + ',' + bottom + ' L ' + xy.map(p=>p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L ') + ' L ' + (pad+(pts.length-1)*stepX).toFixed(1) + ',' + bottom + ' Z';
  const ty = m.target ? bottom - ((m.target - lo)/span) * (bottom - topY) : null;
  const dots = xy.map(p=>'<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="' + C_TEAL + '"/>').join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<line x1="' + pad + '" y1="' + bottom + '" x2="' + (W-pad) + '" y2="' + bottom + '" stroke="' + C_LINE + '"/>' +
    (ty !== null && ty > topY-2 && ty < bottom ? '<line x1="' + pad + '" y1="' + ty.toFixed(1) + '" x2="' + (W-pad) + '" y2="' + ty.toFixed(1) + '" stroke="' + C_AMBER + '" stroke-width="1" stroke-dasharray="4 4"/>' : '') +
    '<path d="' + area + '" fill="rgba(53,230,200,0.10)"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + C_TEAL + '" stroke-width="2" style="filter:drop-shadow(0 0 4px ' + C_TEAL + ')"/>' +
    dots +
    '<text x="' + pad + '" y="' + (H-6) + '" fill="' + C_TXT + '" font-size="9.5" font-family="JetBrains Mono, monospace">' + pts.length + ' PTS</text>' +
    '<text x="' + (W-pad) + '" y="' + (H-6) + '" fill="' + C_TEAL + '" font-size="9.5" text-anchor="end" font-family="JetBrains Mono, monospace">LATEST ' + esc(fmt(pts[pts.length-1])) + ' ' + esc(m.unit) + '</text>' +
    '</svg>';
}

const CHARTS = { kpi: chartKPI, bar: chartBar, bullet: chartBullet, gauge: chartGauge, thermo: chartThermo, line: chartLine };
const TYPE_NAMES = { kpi:'KPI CARD', bar:'PROGRESS BAR', bullet:'BULLET GRAPH', gauge:'GAUGE CHART', thermo:'THERMOMETER', line:'LINE GRAPH' };
function renderChart(m){ return (CHARTS[m.type] || chartKPI)(m); }

// ---------- RENDER ----------
function render(){
  // bound editable fields
  document.querySelectorAll('[data-bind]').forEach(el=>{
    if(document.activeElement === el) return; // don't clobber mid-typing
    const [grp, key] = el.dataset.bind.split('.');
    el.textContent = (state[grp] && state[grp][key]) || '';
  });

  // objectives
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  if(state.tasks.length === 0){
    list.innerHTML = '<div class="empty-note">No objectives yet.</div>';
  } else {
    state.tasks.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'task' + (t.done ? ' done' : '');
      row.innerHTML =
        '<input type="checkbox" ' + (t.done?'checked':'') + ' data-act="toggle" data-id="' + esc(t.id) + '">' +
        '<label data-act="toggle" data-id="' + esc(t.id) + '">' + esc(t.label) + '</label>' +
        '<span class="tag">' + esc(t.tag || 'GENERAL') + '</span>' +
        '<span class="del" data-act="deltask" data-id="' + esc(t.id) + '">&#10005;</span>';
      list.appendChild(row);
    });
  }

  // dynamic progress tracks — headers are editable display labels
  const p = computeProgress();
  const bars = document.getElementById('trackBars');
  bars.innerHTML = '';
  p.tracks.slice(0,8).forEach(tr=>{
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<div class="label-row">' +
        '<span class="track-label edit" contenteditable="true" data-track="' + esc(tr.tag) + '" data-ph="' + esc(tr.tag) + '" title="' + esc(tr.tag) + '">' + esc(tr.label) + '</span>' +
        '<span>' + tr.pct + '% &middot; ' + tr.done + '/' + tr.total + '</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + tr.pct + '%"></div></div>';
    bars.appendChild(row);
  });

  // ring
  const C = 144.5;
  document.getElementById('ringProgress').style.strokeDashoffset = C - (p.overall/100)*C;
  document.getElementById('ringLabel').textContent = p.overall + '%';

  // profile lines
  const pl = document.getElementById('profileList');
  pl.innerHTML = '';
  if(state.profile.lines.length === 0){
    pl.innerHTML = '';
  } else {
    state.profile.lines.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'task';
      row.innerHTML =
        '<label style="cursor:default">' + esc(l.text) + '</label>' +
        (l.flag ? '<span class="tag">' + esc(l.flag) + '</span>' : '') +
        '<span class="del" data-act="delprofile" data-id="' + esc(l.id) + '">&#10005;</span>';
      pl.appendChild(row);
    });
  }

  renderPageGrid();

  // log feed
  const feed = document.getElementById('logFeed');
  feed.innerHTML = '';
  if(state.logs.length === 0){
    feed.innerHTML = '<div class="empty-note">No entries yet.</div>';
  } else {
    [...state.logs].reverse().forEach(entry=>{
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML =
        '<span class="ts">' + esc(entry.time) + '</span><span>' + esc(entry.text) + '</span>' +
        '<span class="del" data-act="dellog" data-id="' + esc(entry.id) + '">&#10005;</span>';
      feed.appendChild(div);
    });
  }

  if(currentPageId) renderMetricPage();
}

function renderPageGrid(){
  const g = document.getElementById('pageGrid');
  g.innerHTML = '';
  if(state.metricPages.length === 0){
    g.innerHTML = '<div class="empty-note">No metric pages yet.</div>';
    return;
  }
  state.metricPages.forEach(pg=>{
    const card = document.createElement('div');
    card.className = 'page-card';
    card.innerHTML =
      '<span class="pdel" data-act="delpage" data-id="' + esc(pg.id) + '" title="Delete page">&#10005;</span>' +
      '<div class="pname">' + esc(pg.name.toUpperCase()) + '</div>' +
      '<div class="pmeta">' + pg.metrics.length + ' METRIC' + (pg.metrics.length===1?'':'S') + '</div>' +
      '<button class="load-btn" data-act="loadpage" data-id="' + esc(pg.id) + '">LOAD &#9656; ' + esc(pg.name.toUpperCase()) + '</button>';
    g.appendChild(card);
  });
}

function getPage(id){ return state.metricPages.find(p=>p.id===id) || null; }

function renderMetricPage(){
  const pg = getPage(currentPageId);
  if(!pg){ backToHud(); return; }
  document.getElementById('mvTitle').textContent = pg.name.toUpperCase();
  document.getElementById('mvSub').textContent = 'METRIC MODULE · ' + pg.metrics.length + ' TRACKED';
  const grid = document.getElementById('metricGrid');
  grid.innerHTML = '';
  if(pg.metrics.length === 0){
    grid.innerHTML = '<div class="panel"><div class="empty-note">No metrics yet.</div></div>';
    return;
  }
  pg.metrics.forEach(m=>{
    const card = document.createElement('div');
    card.className = 'metric-card';
    card.innerHTML = metricCardInner(m);
    grid.appendChild(card);
  });
}

// ---------- HUD DROPDOWN ----------
// Native <select> popups are drawn by the OS and can't be themed, so chart-type
// pickers use this instead. Keyboard + ARIA behave like a real listbox.
let newMetricType = 'kpi';

function hudSelect(attrs, value, map){
  const opts = map || TYPE_NAMES;
  const keys = Object.keys(opts);
  const cur = opts[value] ? value : keys[0];
  return '<div class="hs" ' + attrs + '>' +
    '<div class="hs-trigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="hs-cur">' + esc(opts[cur] || '—') + '</span><span class="hs-caret">&#9660;</span>' +
    '</div>' +
    '<div class="hs-panel" role="listbox">' +
      keys.map(k =>
        '<div class="hs-opt' + (k===cur ? ' sel' : '') + '" role="option" aria-selected="' + (k===cur) + '" data-hs-opt="' + esc(k) + '">' +
        esc(opts[k]) + '</div>').join('') +
    '</div></div>';
}

function closeAllSelects(){
  document.querySelectorAll('.hs.open').forEach(hs=>{
    hs.classList.remove('open','up');
    hs.querySelectorAll('.hs-opt.active').forEach(o=>o.classList.remove('active'));
    const t = hs.querySelector('.hs-trigger');
    if(t) t.setAttribute('aria-expanded','false');
  });
}

function openSelect(hs){
  closeAllSelects();
  hs.classList.add('open');
  hs.querySelector('.hs-trigger').setAttribute('aria-expanded','true');
  // flip upward when there isn't room below
  const r = hs.getBoundingClientRect();
  const panelH = hs.querySelector('.hs-panel').offsetHeight || 200;
  if(r.bottom + panelH + 12 > window.innerHeight && r.top > panelH + 12) hs.classList.add('up');
}

function markSelected(hs, val, label){
  hs.querySelector('.hs-cur').textContent = label;
  hs.querySelectorAll('.hs-opt').forEach(o=>{
    const on = o.dataset.hsOpt === val;
    o.classList.toggle('sel', on);
    o.setAttribute('aria-selected', on);
  });
}

function applySelect(hs, val){
  if(hs.dataset.hs === 'model'){
    cfg.model = val;
    markSelected(hs, val, MODEL_OPTIONS[val] || val);
    return;
  }
  if(!TYPE_NAMES[val]) return;
  if(hs.dataset.hs === 'newtype'){
    newMetricType = val;
    markSelected(hs, val, TYPE_NAMES[val]);
  } else if(hs.dataset.hs === 'mtype'){
    const pg = getPage(currentPageId); if(!pg) return;
    const m = pg.metrics.find(x=>x.id===hs.dataset.id); if(!m) return;
    m.type = val;
    if(m.type === 'line' && m.series.length === 0) m.series = [m.value];
    save(); renderMetricPage();
  }
}

document.addEventListener('click', e=>{
  const opt = e.target.closest('.hs-opt');
  if(opt){ const hs = opt.closest('.hs'); applySelect(hs, opt.dataset.hsOpt); closeAllSelects(); return; }
  const trig = e.target.closest('.hs-trigger');
  if(trig){
    const hs = trig.closest('.hs');
    if(hs.classList.contains('open')) closeAllSelects(); else openSelect(hs);
    return;
  }
  closeAllSelects();
});

document.addEventListener('keydown', e=>{
  const trig = e.target.closest ? e.target.closest('.hs-trigger') : null;
  if(!trig) return;
  const hs = trig.closest('.hs');
  const opts = [...hs.querySelectorAll('.hs-opt')];
  const open = hs.classList.contains('open');
  if(e.key === 'Escape'){ if(open){ e.preventDefault(); closeAllSelects(); } return; }
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if(!open){ openSelect(hs); return; }
    const pick = hs.querySelector('.hs-opt.active') || hs.querySelector('.hs-opt.sel');
    if(pick) applySelect(hs, pick.dataset.hsOpt);
    closeAllSelects();
    return;
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!open){ openSelect(hs); return; }
    let i = opts.findIndex(o=>o.classList.contains('active'));
    if(i < 0) i = opts.findIndex(o=>o.classList.contains('sel'));
    i = Math.max(0, Math.min(opts.length-1, (i < 0 ? 0 : i) + (e.key === 'ArrowDown' ? 1 : -1)));
    opts.forEach(o=>o.classList.remove('active'));
    opts[i].classList.add('active');
  }
});

window.addEventListener('resize', closeAllSelects);
window.addEventListener('scroll', closeAllSelects, true);

// ---------- MODEL PICKER ----------

const DEFAULT_MODEL = 'gemini-3.6-flash';
// Seeded with the current line-up so the picker is useful before a diagnostic runs;

let MODEL_OPTIONS = {
  'gemini-3.7-flash':      'gemini-3.7-flash',
  'gemini-3.6-flash':      'gemini-3.6-flash',
  'gemini-3.5-flash':      'gemini-3.5-flash',
  'gemini-3.5-flash-lite': 'gemini-3.5-flash-lite',
  'gemini-2.5-flash':      'gemini-2.5-flash (legacy)'
};

if(cfg.model && RESTRICTED_MODELS.indexOf(cfg.model) >= 0) delete cfg.model;

// ---------- CONNECTION DIAGNOSTIC ----------
// Lists the models the key can reach, then sends one throwaway generate call.
// Surfaces the raw HTTP status and error so failures stop being guesswork.
// Google began issuing AQ.-prefixed Gemini keys in 2026 alongside the classic
// AIzaSy... ones. Both are valid; only reject shapes that are definitely wrong.
function keyShapeReport(raw){
  const key = raw.trim();
  const notes = [];
  const isAIza = /^AIza/.test(key);
  const isAQ   = /^AQ\./.test(key);
  if(raw !== key) notes.push('had leading/trailing whitespace (auto-trimmed, but check what you pasted)');
  if(/\s/.test(key)) notes.push('<b>contains a space or line break inside it</b> — the paste broke');
  if(/^["']|["']$/.test(key)) notes.push('<b>is wrapped in quotes</b> — paste the key only, no quotes');
  if(!isAIza && !isAQ) notes.push('<b>starts with neither AIza nor AQ.</b> — those are the two Gemini key formats. An OAuth token (ya29...), a service-account JSON, or the key\'s <i>name</i> will all fail here');
  if(isAIza && key.length !== 39) notes.push('<b>is ' + key.length + ' characters</b> — AIza keys are normally 39, so this looks truncated or padded');
  let html = '<b class="dim">KEY SHAPE</b> <span class="dim">' + key.length + ' chars, starts &quot;' +
    esc(key.slice(0,4)) + '&quot;, ends &quot;' + esc(key.slice(-4)) + '&quot;</span>';
  if(isAQ) html += '<br><span class="ok">AQ. format — the newer Gemini key type. Valid.</span>';
  if(notes.length) html += '<br><span class="warn">&#9888; The key ' + notes.join('<br><span class="warn">&#9888; The key ') + '</span>';
  else if(!isAQ) html += '<br><span class="ok">Shape looks normal.</span>';
  return html;
}

// Auth via the x-goog-api-key header, falling back to the ?key= query string if
// the custom-header CORS preflight is what's failing. Reports which path worked.
let lastAuthPath = '';
async function gFetch(path, init, key){
  const base = 'https://generativelanguage.googleapis.com/v1beta/' + path;
  const opts = Object.assign({}, init);
  opts.headers = Object.assign({}, (init && init.headers) || {}, { 'x-goog-api-key': key });
  try{
    const r = await fetch(base, opts);
    lastAuthPath = 'header';
    return r;
  }catch(e){
    const sep = base.indexOf('?') >= 0 ? '&' : '?';
    const r = await fetch(base + sep + 'key=' + encodeURIComponent(key), init);
    lastAuthPath = 'query';
    return r;
  }
}

async function runDiagnostic(){
  const raw = document.getElementById('cfgGeminiKey').value;
  const key = raw.trim();
  const out = document.getElementById('diagOut');
  out.className = 'diag-out show';
  if(!key){ out.innerHTML = '<span class="bad">No API key entered.</span>'; return; }
  out.innerHTML = '<span class="dim">Running...</span>';
  const lines = [keyShapeReport(raw), ''];
  if(location.protocol === 'file:'){
    lines.push('<b class="bad">PAGE OPENED FROM DISK</b>',
      '<span class="warn">This page is running from a file:// path, so the browser sends no origin and Google refuses the request before it is even authenticated. The API cannot be reached this way regardless of your key. Open the hosted version of the HUD (GitHub Pages), or serve the folder locally, then re-run.</span>', '');
  }
  let usable = [];

  // 1. can the key list models at all?
  try{
    const r = await gFetch('models?pageSize=200', null, key);
    const j = await r.json();
    if(!r.ok || j.error){
      const e = j.error || {};
      lines.push('<b class="bad">LIST MODELS &mdash; HTTP ' + r.status + '</b>');
      lines.push('<span class="bad">' + esc(e.status || '') + '</span> ' + esc(e.message || 'Unknown error'));
      if(r.status === 400){
        lines.push('<span class="warn">Google is rejecting the key string itself &mdash; this is NOT a quota or billing problem, and waiting will not fix it. Usual causes, most common first:</span>');
        lines.push('<span class="dim">1. The key was mis-copied &mdash; truncated, or a character dropped. Hit SHOW and compare it to AI Studio.</span>');
        lines.push('<span class="dim">2. The key was deleted or regenerated in AI Studio, so the old string is dead.</span>');
        lines.push('<span class="dim">3. It is the wrong credential &mdash; an OAuth client ID, a service account, or a Vertex AI key. Only an AI Studio AIza... key works here.</span>');
        lines.push('<span class="dim">4. The Generative Language API is disabled on the key\'s Google Cloud project.</span>');
        lines.push('<span class="dim">5. The key has application restrictions (HTTP referrer / IP) that exclude the site serving this page.</span>');
      }
      if(r.status === 403) lines.push('<span class="warn">403 means the key is recognised but not permitted &mdash; check API restrictions on the key, or whether the Generative Language API is enabled on its project.</span>');
      out.innerHTML = lines.join('<br>');
      return;
    }
    usable = (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => String(m.name || '').replace(/^models\//,''))
      .filter(n => n && !/embedding|aqa|imagen|veo|tts/i.test(n));
    lines.push('<b class="ok">KEY VALID</b> <span class="dim">&mdash; ' + usable.length + ' chat models reachable</span>');
    if(usable.length){
      MODEL_OPTIONS = {};
      usable.forEach(n => MODEL_OPTIONS[n] = n);
      if(!MODEL_OPTIONS[activeModel()]) {
        const pick = usable.find(n=>/^gemini-3\.7-flash$/.test(n))
                  || usable.find(n=>/^gemini-3\.6-flash$/.test(n))
                  || usable.filter(n=>/flash$/.test(n)).sort().reverse()[0]
                  || usable.find(n=>/flash/.test(n)) || usable[0];
        lines.push('<span class="warn">' + esc(activeModel()) + ' is NOT available to this key &mdash; switched to ' + esc(pick) + '.</span>');
        cfg.model = pick;
      }
      renderModelSelect();
    }
  }catch(e){
    lines.push('<b class="bad">NETWORK ERROR</b>', esc(e.message),
      '<span class="warn">The request never reached Google, so this is not about your key. In order of likelihood:</span>',
      '<span class="dim">1. The page is open from disk (file://) instead of a real URL — check the address bar.</span>',
      '<span class="dim">2. An ad blocker, privacy extension, or VPN is blocking generativelanguage.googleapis.com. Try a private window with extensions off.</span>',
      '<span class="dim">3. A network/firewall rule is blocking Google APIs.</span>',
      '<span class="dim">4. You are offline.</span>');
    out.innerHTML = lines.join('<br>');
    return;
  }

  // 2. does an actual generate call succeed?
  const model = activeModel();
  lines.push('<span class="dim">Testing ' + esc(model) + '...</span>');
  out.innerHTML = lines.join('<br>');
  try{
    const r = await gFetch('models/' + encodeURIComponent(model) + ':generateContent',
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:'ping' }] }],
          generationConfig:{ maxOutputTokens:1 } }) }, key);
    const j = await r.json();
    lines.pop();
    if(r.ok && !j.error){
      lines.push('<b class="ok">GENERATE OK &mdash; HTTP 200</b>');
      lines.push('<span class="ok">Channel is live on ' + esc(model) + '. Save to apply.</span>');
      lines.push('<span class="dim">Authenticated via ' + esc(lastAuthPath === 'header' ? 'x-goog-api-key header' : '?key= query string') + '.</span>');
    } else {
      const e = j.error || {};
      lines.push('<b class="bad">GENERATE FAILED &mdash; HTTP ' + r.status + '</b>');
      lines.push('<span class="bad">' + esc(e.status || '') + '</span> ' + esc(e.message || 'Unknown error'));
      if(r.status === 429){
        lines.push('<span class="warn">Quota exhausted for this project. Quota is per PROJECT, not per key &mdash; another key on the same project shares it.</span>');
      } else if(r.status === 404){
        lines.push('<span class="warn">This model name does not exist for this key.</span>');
      } else if(r.status === 403){
        lines.push('<span class="warn">Key rejected for generation &mdash; check API restrictions on the key, or whether it is HTTP-referrer-locked to a different domain than the one serving this page.</span>');
      }

      // Rather than guess which model your key is allowed to use, ping each one
      // it can list and report what actually comes back.
      const others = usable.filter(n => n !== model).slice(0, 8);
      if(others.length && [400,403,404,429].indexOf(r.status) >= 0){
        lines.push('', '<b class="dim">SWEEPING EVERY MODEL THIS KEY CAN LIST...</b>');
        out.innerHTML = lines.join('<br>');
        let winner = null;
        for(const m of others){
          let mark;
          try{
            const rr = await gFetch('models/' + encodeURIComponent(m) + ':generateContent',
              { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:'ping' }] }],
                  generationConfig:{ maxOutputTokens:1 } }) }, key);
            if(rr.ok){ mark = '<span class="ok">OK</span>'; if(!winner) winner = m; }
            else {
              const jj = await rr.json().catch(()=>({}));
              mark = '<span class="bad">HTTP ' + rr.status + '</span> <span class="dim">' + esc((jj.error||{}).status || '') + '</span>';
            }
          }catch(err){ mark = '<span class="bad">network</span>'; }
          lines.push('<span class="dim">' + esc(m) + '</span> &rarr; ' + mark);
          out.innerHTML = lines.join('<br>');
        }
        if(winner){
          cfg.model = winner;
          renderModelSelect();
          lines.push('', '<b class="ok">USABLE MODEL FOUND</b>',
            '<span class="ok">Switched to ' + esc(winner) + '. Hit SAVE &amp; CONNECT to apply it.</span>');
        } else {
          lines.push('', '<b class="bad">NO USABLE MODEL ON THIS KEY</b>',
            '<span class="warn">Every model this key can list returned an error. If they are all 429, the project has no remaining allowance &mdash; not a daily reset you can wait out.</span>',
            '<span class="dim">Check your real per-model limits at ai.dev/rate-limit. A limit of 0 means this project was never granted free-tier access for that model. Enabling billing moves the project to Tier 1; a project under a different Google account gets its own allowance.</span>');
        }
      }
    }
  }catch(e){
    lines.pop();
    lines.push('<b class="bad">NETWORK ERROR</b> ' + esc(e.message));
  }
  out.innerHTML = lines.join('<br>');
}

// ============================================================
//  XLSX EXPORT — real .xlsx built in-page.
//  Store-only ZIP + SpreadsheetML. No libraries, works offline.
// ============================================================
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const te = new TextEncoder();
  const d = new Date();
  const dosTime = ((d.getHours()<<11) | (d.getMinutes()<<5) | (Math.floor(d.getSeconds()/2))) & 0xFFFF;
  const dosDate = (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF;
  const locals = [], centrals = [];
  let offset = 0;
  files.forEach(f=>{
    const name = te.encode(f.name);
    const data = te.encode(f.data);
    const crc  = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, dosTime, true); lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
    lh.set(name, 30);
    locals.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true); cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    centrals.push(ch);

    offset += lh.length + data.length;
  });
  const cdSize = centrals.reduce((a,b)=>a+b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  const parts = [...locals, ...centrals, eocd];
  const total = parts.reduce((a,b)=>a+b.length, 0);
  const out = new Uint8Array(total);
  let o = 0; parts.forEach(p=>{ out.set(p, o); o += p.length; });
  return out;
}
function xesc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function colName(i){
  let s = '';
  for(i++; i > 0; i = Math.floor((i-1)/26)) s = String.fromCharCode(65 + (i-1)%26) + s;
  return s;
}
function sheetXml(rows){
  const body = rows.map((row, r)=>{
    const cells = row.map((val, c)=>{
      const ref = colName(c) + (r+1);
      if(typeof val === 'number' && isFinite(val)) return '<c r="' + ref + '"><v>' + val + '</v></c>';
      if(val === '' || val == null) return '';
      return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xesc(val) + '</t></is></c>';
    }).join('');
    return '<row r="' + (r+1) + '">' + cells + '</row>';
  }).join('');
  const widest = rows.reduce((a,r)=>Math.max(a, r.length), 1);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="' + Math.max(2,widest) + '" width="14" customWidth="1"/></cols>' +
    '<sheetData>' + body + '</sheetData></worksheet>';
}
function buildXlsx(sheetName, rows){
  const safe = String(sheetName).replace(/[\[\]\*\/\\\?:]/g,'').slice(0,31) || 'Sheet1';
  return zipStore([
    { name:'[Content_Types].xml', data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '</Types>' },
    { name:'_rels/.rels', data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>' },
    { name:'xl/workbook.xml', data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + xesc(safe) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '</Relationships>' },
    { name:'xl/worksheets/sheet1.xml', data: sheetXml(rows) }
  ]);
}
function exportPageXlsx(){
  const pg = getPage(currentPageId);
  if(!pg || pg.metrics.length === 0) return;
  const maxPts = pg.metrics.reduce((a,m)=>Math.max(a, m.series.length), 0);
  const head = ['Metric','Chart Type','Value','Unit','Target','% of Target'];
  for(let i=0;i<maxPts;i++) head.push('Point ' + (i+1));
  const rows = [head];
  pg.metrics.forEach(m=>{
    const row = [
      m.label,
      TYPE_NAMES[m.type] || 'KPI CARD',
      m.value,
      m.unit || '',
      m.target,
      m.target ? Math.round((m.value / m.target) * 1000) / 10 : ''
    ];
    for(let i=0;i<maxPts;i++) row.push(m.series[i] != null ? m.series[i] : '');
    rows.push(row);
  });
  const bytes = buildXlsx(pg.name, rows);
  const blob = new Blob([bytes], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = String(pg.name).replace(/[^\w\-]+/g,'-').replace(/^-|-$/g,'').toLowerCase() + '-metrics.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

  const m = pg.metrics.find(x=>x.id===el.dataset.id); if(!m) return;
  const f = el.dataset.mnum;
  if(f === 'series'){ m.series = el.value.split(/[, ]+/).filter(s=>s!=='').map(s=>num(s,0)); m.value = m.series.length ? m.series[m.series.length-1] : m.value; }
  else if(f === 'unit'){ m.unit = el.value; }
  else { m[f] = num(el.value, 0); }
  const box = document.getElementById('chart-' + m.id);
  if(box) box.innerHTML = renderChart(m);
  save();
});
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);

        .upsert({ sync_code: k, state, updated_at: new Date().toISOString() }, { onConflict: 'sync_code' });
    }catch(e){ console.warn('sync failed', e); }
  }
}

function pushMsg(role, text, offline){
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user' ? 'user' : 'ev' + (offline ? ' offline' : ''));

const TOOL_DECLARATIONS = [
  { name:"update_task",
    description:"Mark one of the user's objectives complete or incomplete. Use whenever the user says they finished something or wants to un-check it.",
    parameters:{ type:"object", properties:{
      task_id:{type:"string", description:"The task id — see OBJECTIVES list."},
      done:{type:"boolean", description:"true to mark complete, false to mark incomplete"}

  { name:"add_task",
    description:"Add a new objective to the tracker. Use whenever the user asks to add, create, or track something new.",
    parameters:{ type:"object", properties:{
      label:{type:"string", description:"The objective text, concise"},
      tag:{type:"string", description:"Short uppercase category tag. Reuse a tag already in the user's list when it fits, since each tag becomes a progress track."}
    }, required:["label"] } },
  { name:"remove_task",
    description:"Permanently remove an objective. Use whenever the user asks to delete or drop one.",
    parameters:{ type:"object", properties:{
      task_id:{type:"string", description:"The task id to remove — see OBJECTIVES list."}
    }, required:["task_id"] } },
  { name:"add_log_entry",

    parameters:{ type:"object", properties:{
      text:{type:"string", description:"The log entry text, concise, in the user's voice"}
    }, required:["text"] } },
  { name:"set_mission",
    description:"Set or update the ACTIVE MISSION panel — the user's headline goal, its one-line description, and the single next action.",
    parameters:{ type:"object", properties:{
      name:{type:"string", description:"Headline goal, short and punchy"},
      sub:{type:"string", description:"One-line description of the goal"},
      next:{type:"string", description:"The single next concrete action"}
    } } },
  { name:"set_track_label",

    parameters:{ type:"object", properties:{
      tag:{type:"string", description:"The existing objective tag, e.g. PYTHON"},
