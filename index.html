function findPage(ref){
  if(!ref) return null;
  const r = String(ref).toLowerCase();
  return state.metricPages.find(p=>p.id===ref) ||
         state.metricPages.find(p=>p.name.toLowerCase()===r) ||
         state.metricPages.find(p=>p.name.toLowerCase().includes(r)) || null;
}
function findMetric(pg, ref){
  if(!pg || !ref) return null;
  const r = String(ref).toLowerCase();
  return pg.metrics.find(m=>m.id===ref) ||
         pg.metrics.find(m=>m.label.toLowerCase()===r) ||
         pg.metrics.find(m=>m.label.toLowerCase().includes(r)) || null;
}
function refreshAll(){ save(); if(currentPageId) renderMetricPage(); else render(); }

const toolFunctions = {
  update_task(a){
    const t = state.tasks.find(t=>t.id===a.task_id);
    if(!t) return { success:false, error:'No task with id ' + a.task_id };
    t.done = !!a.done; refreshAll();
    return { success:true, task:t.label, done:t.done };
  },
  add_task(a){
    if(!a.label) return { success:false, error:'Missing label' };
    const t = { id: uid('t'), label:a.label, done:false, tag:(a.tag||'GENERAL').toUpperCase() };
    state.tasks.push(t); refreshAll();
    return { success:true, task_id:t.id, label:t.label, tag:t.tag };
  },
  remove_task(a){
    const removed = state.tasks.find(t=>t.id===a.task_id);
    if(!removed) return { success:false, error:'No task with id ' + a.task_id };
    state.tasks = state.tasks.filter(t=>t.id!==a.task_id); refreshAll();
    return { success:true, removed:removed.label };
  },
  add_log_entry(a){
    if(!a.text) return { success:false, error:'Missing text' };
    state.logs.push({ id: uid('l'), text:a.text, time: stamp() });
    refreshAll();
    return { success:true, logged:a.text };
  },
  set_mission(a){
    if(a.name != null) state.mission.name = a.name;
    if(a.sub  != null) state.mission.sub  = a.sub;
    if(a.next != null) state.mission.next = a.next;
    refreshAll();
    return { success:true, mission: state.mission };
  },
  set_track_label(a){
    const tag = String(a.tag||'').toUpperCase();
    if(!tag) return { success:false, error:'Missing tag' };
    const exists = state.tasks.some(t=>(t.tag||'GENERAL').toUpperCase()===tag);
    if(!exists) return { success:false, error:'No objectives carry the tag ' + tag };
    if(!a.label || String(a.label).trim()==='' ) delete state.trackLabels[tag];
    else state.trackLabels[tag] = String(a.label).trim();
    refreshAll();
    return { success:true, tag, label: state.trackLabels[tag] || tag };
  },
  update_profile(a){
    if(a.metric_label != null) state.profile.metricLabel = a.metric_label;
    if(a.metric_value != null) state.profile.metricValue = a.metric_value;
    if(a.add_line) state.profile.lines.push({ id: uid('p'), text:a.add_line, flag:(a.line_flag||'').toUpperCase() });
    refreshAll();
    return { success:true, profile: state.profile };
  },
  add_metric_page(a){
    if(!a.name) return { success:false, error:'Missing name' };
    if(findPage(a.name)) return { success:false, error:'A page named ' + a.name + ' already exists' };
    const pg = { id: uid('pg'), name:String(a.name), metrics:[] };
    state.metricPages.push(pg); refreshAll();
    return { success:true, page_id:pg.id, name:pg.name };
  },
  add_metric(a){
    const pg = findPage(a.page);
    if(!pg) return { success:false, error:'No metric page matching ' + a.page };
    const m = normalizeMetric({ label:a.label, type:a.type, value:a.value, target:a.target==null?100:a.target, unit:a.unit });
    if(m.type === 'line') m.series = [m.value];
    pg.metrics.push(m); refreshAll();
    return { success:true, page:pg.name, metric_id:m.id, label:m.label, type:m.type, value:m.value, target:m.target };
  },
  set_metric(a){
    const pg = findPage(a.page);
    if(!pg) return { success:false, error:'No metric page matching ' + a.page };
    const m = findMetric(pg, a.metric);
    if(!m) return { success:false, error:'No metric matching ' + a.metric + ' on ' + pg.name };
    if(a.type && TYPE_NAMES[a.type]) m.type = a.type;
    if(a.target != null) m.target = num(a.target, m.target);
    if(a.value != null){
      m.value = num(a.value, m.value);
      if(m.type === 'line'){
        if(a.append_point === false && m.series.length) m.series[m.series.length-1] = m.value;
        else m.series.push(m.value);
      }
    }
    refreshAll();
    return { success:true, page:pg.name, metric:m.label, value:m.value, target:m.target, type:m.type, points:m.series.length };
  },
  remove_metric(a){
    const pg = findPage(a.page);
    if(!pg) return { success:false, error:'No metric page matching ' + a.page };
    const m = findMetric(pg, a.metric);
    if(!m) return { success:false, error:'No metric matching ' + a.metric };
    pg.metrics = pg.metrics.filter(x=>x.id!==m.id); refreshAll();
    return { success:true, removed:m.label };
  }
};

function buildSystemPrompt(){
  const p = computeProgress();
  const tracks = p.tracks.length
    ? p.tracks.map(t=>`${t.label}${t.label!==t.tag?` (tag ${t.tag})`:''}: ${t.pct}% (${t.done}/${t.total})`).join(' | ')
    : 'No tracks yet.';
  const taskSummary = state.tasks.length
    ? state.tasks.map(t=>`- id:${t.id} [${t.done?'x':' '}] ${t.label} (${t.tag})`).join('\n')
    : 'No objectives set yet.';
  const logSummary = state.logs.length
    ? state.logs.slice(-8).map(l=>`${l.time}: ${l.text}`).join('\n')
    : 'No logs yet.';
  const profileSummary = [
    state.profile.metricLabel || state.profile.metricValue
      ? `${state.profile.metricLabel || 'Metric'}: ${state.profile.metricValue || '—'}` : null,
    ...state.profile.lines.map(l=> '- ' + l.text + (l.flag ? ` [${l.flag}]` : ''))
  ].filter(Boolean).join('\n') || 'Profile not filled in yet.';
  const metricSummary = state.metricPages.length
    ? state.metricPages.map(pg =>
        `PAGE "${pg.name}" (id:${pg.id})\n` + (pg.metrics.length
          ? pg.metrics.map(m=>`  - id:${m.id} ${m.label} [${m.type}] ${m.value}${m.unit?' '+m.unit:''} / target ${m.target}${m.type==='line'?` (${m.series.length} pts)`:''}`).join('\n')
          : '  (no metrics yet)')
      ).join('\n')
    : 'No metric pages yet.';
  const who = (state.user && state.user.name) ? state.user.name : '';

  return `You are E.V., a sharp, quick-witted advisory AI embedded in ${who ? who + "'s" : "the user's"} personal status tracker. Talk like a genuinely smart, capable person who's in their corner — direct, a little dry-witted, warm underneath. Never use bracketed system-diagnostic voice like "[SCANNING...]" — that's a bit, not a personality. Keep replies brief unless asked for more.
${who ? `The user's name is ${who}. Use it sparingly and naturally.` : ''}
You do not know anything about the user beyond what appears below. Do not invent a school, employer, career, or background for them. If the tracker is empty, your first job is to ask what they're working toward, then use set_mission, add_task, and update_profile to set it up for them instead of making them type it all in.
You have real tools — they actually change the user's data, they are not roleplay. When the user asks you to check something off, add or delete an objective, log something, rename a track, change their mission or profile, or update a number they track, CALL THE TOOL. Never claim you saved, added, removed, or logged something unless you actually called the matching tool.
Objectives are grouped by tag, and every tag becomes its own progress track — so reuse existing tags when adding related work, and invent a new one only for a genuinely new area. Track headers can carry a friendlier display label via set_track_label; the tag itself never changes.
Metrics live on named pages the user loads from the HUD. Chart types are: kpi, bar (progress bar), bullet, gauge, thermo (thermometer), line. Pick the type that fits — bullet or bullet-like for value-vs-target, gauge or thermo for percentage-of-goal, line for anything tracked over time, kpi for a single headline number.
You also have live web search — use it whenever a question depends on current information rather than guessing.
MISSION: ${state.mission.name || '(not set)'}
DETAIL: ${state.mission.sub || '(not set)'}
NEXT ACTION: ${state.mission.next || '(not set)'}
OVERALL: ${p.overall}% (${p.done}/${p.total} objectives complete)
TRACKS: ${tracks}
PROFILE:
${profileSummary}
METRIC PAGES:
${metricSummary}
OBJECTIVES (use the id field with update_task / remove_task):
${taskSummary}
RECENT LOG:
${logSummary}`;
}

async function callGemini(contents){
  const res = await gFetch(
    'models/' + encodeURIComponent(activeModel()) + ':generateContent',
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: buildSystemPrompt() }] },
        contents,
        tools: [ { function_declarations: TOOL_DECLARATIONS }, { google_search: {} } ]
      })
    }, cfg.geminiKey);
  return res.json();
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  if(!apiOnline()){
    pushMsg('ev', 'API OFFLINE — AWAITING CONNECTION.', true);
    return;
  }
  input.value = '';
  pushMsg('user', text);
  chatHistory.push({ role:'user', parts:[{ text }] });

  const typing = document.createElement('div');
  typing.className = 'typing'; typing.id = 'typingIndicator';
  typing.textContent = 'E.V. is thinking...';
  chatWindow.appendChild(typing);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  try{
    let data = await callGemini(chatHistory);
    let parts = data?.candidates?.[0]?.content?.parts || [];
    let guard = 0;
    while(parts.some(p=>p.functionCall) && guard < 4){
      guard++;
      chatHistory.push({ role:'model', parts });
      const responseParts = [];
      for(const p of parts){
        if(p.functionCall){
          const fn = toolFunctions[p.functionCall.name];
          const result = fn ? fn(p.functionCall.args || {}) : { success:false, error:'Unknown function' };
          responseParts.push({ functionResponse:{ name:p.functionCall.name, response:result } });
        }
      }
      chatHistory.push({ role:'user', parts: responseParts });
      data = await callGemini(chatHistory);
      parts = data?.candidates?.[0]?.content?.parts || [];
    }
    document.getElementById('typingIndicator')?.remove();
    if(data.error){
      const msg = String(data.error.message || '');
      const quota = /quota|exhaust|billing|RESOURCE_EXHAUSTED|429/i.test(msg);
      const dead  = /no longer available|not found|not supported|deprecat/i.test(msg);
      pushMsg('ev',
        dead  ? 'MODEL UNAVAILABLE — ' + activeModel() + ' cannot be used with this key. Open SYSTEM CONFIG, ADVISORY tab, and hit RUN DIAGNOSTIC — it will list the models your key can reach and switch to one.\n\n' + msg
      : quota ? 'API OFFLINE — QUOTA EXHAUSTED. ' + msg
      :         'API ERROR: ' + msg, true);
      return;
    }
    const reply = (parts.find(p=>p.text)?.text) || 'Done.';
    pushMsg('ev', reply);
    chatHistory.push({ role:'model', parts:[{ text: reply }] });
  }catch(e){
    document.getElementById('typingIndicator')?.remove();
    pushMsg('ev', 'API OFFLINE — CONNECTION FAILED. Could not reach the advisory channel.', true);
    console.error(e);
  }
}

function greet(){
  const nm = (state.user && state.user.name || '').trim();
  const hello = nm ? 'Hello, ' + nm + '. ' : '';
  if(!apiOnline()){
    pushMsg('ev', hello + 'API OFFLINE — AWAITING CONNECTION.', true);
    return;
  }
  const blank = !state.mission.name && state.tasks.length === 0;
  pushMsg('ev', 'API ONLINE — CONNECTION ESTABLISHED. ' + hello +
    (blank ? "What are you working toward?" : "What's the status?"));
}
